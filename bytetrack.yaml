tracker_type: bytetrack
track_high_thresh: 0.25      # min conf for high-quality detection association
track_low_thresh: 0.05       # min conf to even consider a detection
new_track_thresh: 0.25       # min conf to start a new track
track_buffer: 120            # keep lost tracks alive longer (~4.8s at 25fps)
match_thresh: 0.85           # more lenient IoU matching = fewer ID switches
fuse_score: True             # fuse detection score into track score
